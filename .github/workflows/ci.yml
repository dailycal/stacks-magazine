name: CI

# Checks that the site builds. Deploying is handled by Cloudflare Workers
# Builds (see wrangler.jsonc), not by this workflow.
on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes an in-progress run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Same major version as Cloudflare's build image
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build
